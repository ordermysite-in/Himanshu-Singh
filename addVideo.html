<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Management - Classic Light Showcase</title>
    <link rel="stylesheet" href="../index.css" />
    <style>
        /* Strict Reset & Sharp Edges */
        * {
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Light Header Layout */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: #ffffff;
            padding: 1rem 0;
            color: #000000;
            border-bottom: 2px solid #000000;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo a {
            text-decoration: none;
            color: #000000;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: #000000;
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid transparent;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            border: 1px solid #000000;
            background-color: #000000;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #000000;
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 2px solid #000000;
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Form styling for Upload / Edit */
        .form-section {
            background: #f9f9f9;
            border: 2px solid #000000;
            padding: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            font-size: 1rem;
            outline: none;
        }

        .btn-submit {
            background: #000000;
            color: #ffffff;
            padding: 10px 20px;
            border: 1px solid #000000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-cancel {
            background: #ffffff;
            color: #000000;
            padding: 10px 20px;
            border: 1px solid #000000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-left: 10px;
        }

        .btn-cancel:hover {
            background: #000000;
            color: #ffffff;
        }

        /* Classic YouTube List Layout */
        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .video-card {
            background: #f9f9f9;
            border: 1px solid #000000;
            display: flex;
            flex-direction: row;
            padding: 12px;
            gap: 20px;
            align-items: flex-start;
        }

        .thumbnail-wrapper {
            position: relative;
            width: 240px;
            height: 135px;
            background: #000000;
            flex-shrink: 0;
            border: 1px solid #000000;
        }

        .thumbnail-wrapper iframe,
        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }

        .video-card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 135px;
        }

        .video-card-title {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            color: #000000;
            line-height: 1.4;
            font-weight: bold;
        }

        .video-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-action {
            padding: 8px 16px;
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid #000000;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            background: #ffffff;
            color: #000000;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: #000000;
            color: #ffffff;
        }

        footer {
            background-color: #ffffff;
            text-align: center;
            color: #000000;
            padding: 20px 0;
            border-top: 2px solid #000000;
            margin-top: 50px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .video-card {
                flex-direction: column;
            }

            .thumbnail-wrapper {
                width: 100%;
                height: 200px;
            }

            .video-card-body {
                height: auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html">PORTFOLIO</a>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../videos.html" class="active">Videos</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 class="header-title">
            <span id="formHeaderTitle">Add New Video</span>
        </h2>

        <!-- Upload / Edit Form Section -->
        <div class="form-section">
            <input type="hidden" id="editDocId" value="" />
            <div class="form-group">
                <label for="videoTitle">Video Title</label>
                <input type="text" id="videoTitle" placeholder="Enter video title..." required />
            </div>
            <div class="form-group">
                <label for="videoId">YouTube Video ID / URL</label>
                <input type="text" id="videoId" placeholder="e.g. dQw4w9WgXcQ or https://youtu.be/..." required />
            </div>
            <button class="btn-submit" id="saveBtn" onclick="saveVideo()">Save Video</button>
            <button class="btn-cancel" id="cancelBtn" onclick="resetForm()" style="display:none;">Cancel</button>
        </div>

        <h2 class="header-title">
            <span>Uploaded Videos</span>
        </h2>

        <div id="loading" style="margin-top: 20px; text-align: center; font-weight: bold;">Loading video feed...</div>
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Himanshu Singh. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1u5m750xBcskU-m6fLG7yXqpp72Bsdx4",
            authDomain: "himanshusingh-1.firebaseapp.com",
            projectId: "himanshusingh-1",
            storageBucket: "himanshusingh-1.firebasestorage.app",
            messagingSenderId: "1022932138361",
            appId: "1:1022932138361:web:d58e3808afe8aace4bd7a8",
            measurementId: "G-7K5TRMJ5Z4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const videoGrid = document.getElementById('videoGrid');
        const loading = document.getElementById('loading');
        const videoTitleInput = document.getElementById('videoTitle');
        const videoIdInput = document.getElementById('videoId');
        const editDocIdInput = document.getElementById('editDocId');
        const formHeaderTitle = document.getElementById('formHeaderTitle');
        const cancelBtn = document.getElementById('cancelBtn');

        let cacheVideos = [];

        // Helper function to extract 11-digit YouTube ID
        function extractYouTubeId(urlOrId) {
            if (!urlOrId) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId.trim();
        }

        // Fetch videos from Firestore
        async function fetchVideos() {
            try {
                loading.style.display = 'block';
                const querySnapshot = await getDocs(collection(db, "videos"));
                loading.style.display = 'none';

                videoGrid.innerHTML = "";
                cacheVideos = [];

                if (querySnapshot.empty) {
                    videoGrid.innerHTML = "<p style='text-align:center;'>No videos uploaded yet.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const video = docSnap.data();
                    const id = docSnap.id;
                    const cleanVideoId = extractYouTubeId(video.videoId || video.videoUrl);

                    cacheVideos.push({ id, videoId: cleanVideoId, title: video.title });

                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="thumbnail-wrapper">
                            <iframe src="https://www.youtube.com/embed/${cleanVideoId}" allowfullscreen title="Preview"></iframe>
                        </div>
                        <div class="video-card-body">
                            <div>
                                <h3 class="video-card-title">${escapeHtml(video.title)}</h3>
                                <p style="font-size: 0.8rem; color: #555;">ID: ${cleanVideoId}</p>
                            </div>
                            <div class="video-actions">
                                <button class="btn-action" onclick="startEdit('${id}')">Edit</button>
                                <button class="btn-action" onclick="deleteVideo('${id}')">Delete</button>
                            </div>
                        </div>
                    `;
                    videoGrid.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching videos:", error);
                loading.innerText = "Error loading videos.";
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Add / Update Video
        window.saveVideo = async function () {
            const title = videoTitleInput.value.trim();
            const rawVideoId = videoIdInput.value.trim();
            const editId = editDocIdInput.value;

            if (!title || !rawVideoId) {
                alert("Please fill in all fields.");
                return;
            }

            const cleanId = extractYouTubeId(rawVideoId);

            try {
                if (editId) {
                    // Update existing video
                    await setDoc(doc(db, "videos", editId), {
                        title: title,
                        videoId: cleanId,
                        updatedAt: new Date()
                    }, { merge: true });
                    alert("Video updated successfully!");
                } else {
                    // Create new video
                    await addDoc(collection(db, "videos"), {
                        title: title,
                        videoId: cleanId,
                        createdAt: new Date()
                    });
                    alert("Video added successfully!");
                }
                resetForm();
                fetchVideos();
            } catch (e) {
                alert("Error saving video: " + e.message);
            }
        };

        // Populate Edit Form
        window.startEdit = function (id) {
            const video = cacheVideos.find(v => v.id === id);
            if (video) {
                editDocIdInput.value = video.id;
                videoTitleInput.value = video.title;
                videoIdInput.value = video.videoId;
                formHeaderTitle.innerText = "Edit Video Details";
                cancelBtn.style.display = "inline-block";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        // Reset Form to Add Mode
        window.resetForm = function () {
            editDocIdInput.value = "";
            videoTitleInput.value = "";
            videoIdInput.value = "";
            formHeaderTitle.innerText = "Add New Video";
            cancelBtn.style.display = "none";
        };

        // Delete Video
        window.deleteVideo = async function (id) {
            if (confirm("Are you sure you want to delete this video?")) {
                try {
                    await deleteDoc(doc(db, "videos", id));
                    fetchVideos();
                } catch (e) {
                    alert("Delete failed: " + e.message);
                }
            }
        };

        fetchVideos();
    </script>
</body>

</html>
